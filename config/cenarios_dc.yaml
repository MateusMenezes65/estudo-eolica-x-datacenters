# Cenários de carga incremental de data centers no subsistema NE (L_DC)
# Decisões do usuário: cenários de DC reproduzem a projeção oficial e o inventário documentado
# (2026-11-11); caso-base = carga do NE na 2ª RQ do PLAN 2026-2030 SEM a carga de DC de Rede
# Básica da mesma projeção, L_DC = 0 (2026-11-12, decisão 29; substitui o PDE 2035 como base).
# Valores oficiais: config/dc_trajetoria_oficial_ne.csv; projetos: config/data_centers_ne.csv.
# Parâmetros marcados `hipotese` são HIPÓTESES DE CENÁRIO (regra 1), não fatos observados.

versao: 0.3   # cenário alto aceito pelo usuário em 2026-11-11
horizonte: {ano_referencia: 2030, ano_intermediario: 2028}

# Projeção oficial: previsão de carga do PLAN 2026-2030, 2ª Revisão Quadrimestral
# (ONS/EPE/CCEE; base de acessos de 22/07/2026). Já está em MWmed de carga na Rede
# Básica (inclui DC junto a eólicas): NÃO aplicar PUE nem utilização sobre ela.
# Critério oficial: 100% da carga com contrato assinado + 50% com parecer favorável.
referencia_oficial: {estudo: "2a RQ PLAN 2026-2030", unidade: MWmed}

perfil_horario: flat   # o PDE e o PLAN tratam grandes cargas como flat (PDE, Box 2.1)

cenarios:
  sem_dc:
    descricao: >-
      caso-base = carga do NE da 2ª RQ do PLAN sem nenhum DC de Rede Básica (18.278 − 2.098 =
      16.180 MWmed; L_DC = 0). Contrafactual: retira também os DC que entram a partir de 2026.
    componentes: []
  conservador:
    descricao: só contratos assinados da 2ª RQ (100%)
    componentes: [{fonte: oficial, componente: contratos_assinados, peso: 1.0}]
    # 2030: 1.886 MWmed
  central:
    descricao: reproduz a 2ª RQ do PLAN 2026-2030 (contratos 100% + pareceres 50%)
    componentes: [{fonte: oficial, componente: total, peso: 1.0}]
    # 2030: 2.098 MWmed
  alto:
    descricao: >-
      contratos 100% + pareceres 100% + projetos M3 do inventário com MW publicado
      e sem contrato ou parecer identificado na 2ª RQ (aceito pelo usuário em 2026-11-11).
    possivel_sobreposicao: >-
      CDV_ACESSOS é um direito de acesso comprado e tem processo oficial (Portaria
      2.835/2024). Não foi possível verificar se já está entre os pareceres favoráveis da
      2ª RQ; se estiver, o cenário alto o conta duas vezes (266 MWmed em 2030, cerca de 10%
      do cenário). Sem ele o cenário alto seria de 2.487 MWmed. Mantido pelo usuário em 2026-11-15 (decisão 44).
    componentes:
      - {fonte: oficial, componente: contratos_assinados, peso: 1.0}
      - {fonte: oficial, componente: pareceres_favoraveis_50pct, peso: 2.0}   # 50% -> 100%
      - {fonte: inventario, maturidade: [M3], ids: [CDV_ACESSOS, QAIR2, ENEGIX]}
    # 2030: 1.886 + 424 + inventário (645 + 415 + 100) x utilização x rampa

parametros_inventario:   # só para itens do inventário (potência != MWmed de carga)
  utilizacao_madura: {central: 0.75, faixa: [0.6, 0.9], tipo: hipotese}
  rampa_meses: {central: 24, faixa: [12, 36], tipo: hipotese}
  entrada_sem_data: {regra: "data da informação + 36 meses", tipo: hipotese}
  pue_se_potencia_de_TI: {central: 1.35, faixa: [1.2, 1.5], tipo: hipotese}
  potencia_sem_definicao: tratar_como_demanda_total   # sensibilidade: tratar_como_TI

maturidade:
  M0: em operação até 2025-12-31 (já na carga histórica; não é incremental)
  M1: em operação desde 2026, obra iniciada ou contrato de conexão com cronograma
  M2: contrato/viabilidade de conexão ou pedido com parecer, sem cronograma de operação
  M3: anúncio, protocolo, memorando ou direito de acesso sem projeto definido

conferencias:
  teto_pipeline_mme_ne_2038_GW: 8.30   # PDE 2035, Caderno de Transmissão (mapa por UF; soma CE+BA+SE+PI+RN+PE)
  teto_pipeline_mme_brasil_2030_MW: 17422
  dupla_contagem_pde: >-
    O PDE 2035 de referência (demanda fechada em set/2025) pode já conter parte da
    carga de DC de Rede Básica do NE. A projeção vigente na época (2ª RQ do PLAN
    2025-2029) tinha cerca de 258 MWmed no NE em 2029 (PLAN 26-30 = 644 menos o
    acréscimo de 386). Sensibilidade: descontar 258 MWmed de L_DC em 2030.
  ja_na_historia: >-
    A carga histórica 2022-2025 contém só colocation pequena (ordem de 25 MW no
    NE, distribuição). DC de Rede Básica no NE começa em 2026 (Renova Satoshi).
