# Cenários e hipóteses do balanço horário do NE em 2030 (simulador determinístico)
# Fontes: config/pde2035_extraido.csv, SIGA (data/raw/aneel/siga), config/cenarios_dc.yaml.
# `tipo: hipotese` = premissa de cenário (regra 1); `tipo: dado` = valor publicado.

ano_alvo: 2030
anos_climaticos_calibracao: [2022, 2023, 2024, 2025]   # perfis horários observados

carga:
  # Decisão do usuário (2026-11-12): base = 2ª Revisão Quadrimestral do PLAN 2026-2030
  # (ONS/EPE/CCEE, ago/2026), carga global do NE em 2030 SEM a carga de DC de Rede Básica,
  # que entra separadamente pelos cenários de config/cenarios_dc.yaml (sem dupla contagem).
  L_gross_sem_dc_MWmed: {valor: 16180, tipo: dado, fonte: "2ª RQ PLAN 26-30: 18.278 (slide 79) − 2.098 de DC (slide 71)"}
  forma_horaria: carga bruta do ano climático normalizada pela média anual
  sensibilidade_pde: {L_gross_MWmed: 16340, desconto_dc_embutido_MWmed: 258,
                      fonte: "PDE 2035 Tabela 2-3; DC da 2ª RQ do PLAN 25-29 em 2029"}

mmgd:
  media_2030_MWmed: {valor: 2386, tipo: dado, fonte: "2ª RQ PLAN 26-30, slide 60 (NE, base + expansão)"}
  faixa_sensibilidade_MWmed: {valores: [1939, 2718], tipo: hipotese,
                              fonte: "MMGD do NE em 2025 (API, 1.527) × crescimento da capacidade de MMGD do Brasil no PDE, cenários inferior (1,27) e superior (1,78)"}
  forma_horaria: MMGD do ano climático normalizada pela média anual

eolica:
  # SIGA (fotografia 2026-11-01) não traz datas previstas para projetos fora de operação.
  capacidade_2030_MW:
    baixa: {valor: 32250, tipo: hipotese, regra: "só usinas em operação (SIGA)"}
    base:  {valor: 34288, tipo: hipotese, regra: "operação + em construção (SIGA, 2,04 GW)"}
    alta:  {valor: 39388, tipo: hipotese, regra: "base + expansão indicativa do PDE até 2030 (5,1 GW no SIN) toda no NE"}
  cf: CF potencial (geração + GNRa) do ano climático x fator de frota (modelo B0 da frota recente)

solar:
  capacidade_2030_MW: {valor: 13500, tipo: hipotese, regra: "operação + construção (SIGA); PDE sem expansão solar indicativa até 2031"}
  cf: CF solar potencial do ano climático (observado antes de 2024-04, sem dado de corte) x fator de frota (modelo C0)

hidro_termica:
  regra: geração hidráulica e térmica horária observada no ano climático (despacho histórico)
  tipo: hipotese
  sensibilidade: hidraulica_plana   # mesma energia anual do ano, perfil constante (pessimista); decisão do usuário 2026-11-12
  # Monte Carlo: regra hidráulica emulada. O coeficiente beta cai quando a carga líquida potencial oscila
  # mais dentro do dia (0,42 em 2022 com desvio de 1,9 GW; 0,16 em 2025 com 4,6 GW), e em 2030 o desvio
  # simulado é ~6,9 GW. O caso central usa o beta do ano observado com a oscilação mais próxima da de 2030
  # (2026, 5,9 GW); o beta do próprio ano hidrológico e a amplitude constante em MW são sensibilidades.
  beta_regra: {ano_referencia: 2026, periodo: ["2026-01-01", "2026-10-31 23:00"], tipo: "parâmetro estimado",
               nota: "horas em que o balanço do ONS fecha; decisão 57, usuário 2026-11-25"}
  limitacao: >-
    Não representa redespacho: em 2030 a térmica e a hidráulica do São Francisco
    poderiam responder a déficits ou excedentes.

intercambio:
  limite_exportacao_MW: {valor: 21000, tipo: dado, fonte: "PDE 2035, seção 4.3.2 (a partir de 2030)"}
  limites_importacao_sensibilidade_MW: {valores: [6000, 8000, 10000], tipo: hipotese,
                                        nota: "sem limite documentado; máximo histórico de fluxo 2022-2025 ≈ 7,9 GW (fluxo não é capacidade)"}

compensacao_eolica:
  criterios: [energia_anual, importacao_anual, horas_importacao, p95_importacao]
  busca_MW: {min: 0, max: 30000, tolerancia: 10}
